server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip text-based responses
    gzip on;
    gzip_types text/plain text/css application/javascript application/json font/ttf;
    gzip_min_length 1024;

    # Long cache for fonts + payment / brand logos — content-hashed in practice
    location ~* \.(?:ttf|otf|woff|woff2|png|jpg|jpeg|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Always revalidate HTML so deploys take effect
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
